<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Viral1s Load Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #09090d;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    .panel {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #8e8e9b;
      font-size: 14px;
    }

    .card {
      background: #111116;
      border: 1px solid #24242d;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #c9c9d2;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid #30303a;
      border-radius: 12px;
      background: #0b0b10;
      color: #fff;
      padding: 13px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      background:
        linear-gradient(
          135deg,
          #6b4cff,
          #425ce8
        );
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .warning {
      margin-top: 14px;
      color: #a3a3af;
      font-size: 12px;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat {
      background: #0b0b10;
      border: 1px solid #24242d;
      border-radius: 14px;
      padding: 14px;
    }

    .stat span {
      display: block;
      color: #858593;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .stat strong {
      font-size: 20px;
    }

    #status {
      margin-top: 16px;
      color: #aaaab5;
      font-size: 13px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .progress {
      width: 100%;
      height: 8px;
      margin-top: 16px;
      background: #202029;
      border-radius: 99px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background:
        linear-gradient(
          90deg,
          #6b4cff,
          #4d6cff
        );
      transition: width 0.2s ease;
    }
  </style>
</head>

<body>

  <main class="panel">

    <h1>Viral1s Load Test</h1>
    <p class="subtitle">
      Test simultaneous Reel exports
    </p>

    <section class="card">

      <label for="users">
        Simultaneous users
      </label>

      <input
        id="users"
        type="number"
        min="1"
        max="1000"
        value="10"
      />

      <label for="testImage">
        Test image
      </label>

      <input
        id="testImage"
        type="file"
        accept="image/*"
      />

      <button id="startBtn">
        Start Load Test
      </button>

      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <p class="warning">
        Start with 10 users. Increase gradually:
        10 → 20 → 50 → 100.
        Do not jump directly to 1000.
      </p>

    </section>

    <section class="card">

      <div class="stats">

        <div class="stat">
          <span>Completed</span>
          <strong id="completed">0</strong>
        </div>

        <div class="stat">
          <span>Success</span>
          <strong id="success">0</strong>
        </div>

        <div class="stat">
          <span>Failed</span>
          <strong id="failed">0</strong>
        </div>

        <div class="stat">
          <span>Average time</span>
          <strong id="average">0s</strong>
        </div>

        <div class="stat">
          <span>Fastest</span>
          <strong id="fastest">0s</strong>
        </div>

        <div class="stat">
          <span>Slowest</span>
          <strong id="slowest">0s</strong>
        </div>

      </div>

      <div id="status">
        Waiting for test...
      </div>

    </section>

  </main>

<script>

const EXPORT_URL =
  "https://mini-video-editor-production.up.railway.app/export-reel";

const usersInput =
  document.getElementById("users");

const testImage =
  document.getElementById("testImage");

const startBtn =
  document.getElementById("startBtn");

const completedEl =
  document.getElementById("completed");

const successEl =
  document.getElementById("success");

const failedEl =
  document.getElementById("failed");

const averageEl =
  document.getElementById("average");

const fastestEl =
  document.getElementById("fastest");

const slowestEl =
  document.getElementById("slowest");

const statusEl =
  document.getElementById("status");

const progressBar =
  document.getElementById("progressBar");


async function createHookBlob() {

  const canvas =
    document.createElement("canvas");

  canvas.width = 720;
  canvas.height = 150;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "#000000";
  ctx.font =
    "bold 42px Arial";

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    "Viral1s load test",
    360,
    75
  );

  return new Promise((resolve) => {

    canvas.toBlob(
      (blob) => resolve(blob),
      "image/png"
    );

  });

}


async function runSingleExport(
  imageFile,
  hookBlob,
  index
) {

  const formData =
    new FormData();

  formData.append(
    "image",
    imageFile,
    imageFile.name
  );

  formData.append(
    "hookImage",
    hookBlob,
    `hook-${index}.png`
  );

  formData.append(
    "hookHeight",
    "150"
  );

  const start =
    performance.now();

  try {

    const response =
      await fetch(
        EXPORT_URL,
        {
          method: "POST",
          body: formData
        }
      );

    const elapsed =
      (performance.now() - start) / 1000;

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    await response.blob();

    return {
      success: true,
      time: elapsed
    };

  } catch (error) {

    const elapsed =
      (performance.now() - start) / 1000;

    return {
      success: false,
      time: elapsed,
      error:
        error.message ||
        "Unknown error"
    };

  }

}


startBtn.addEventListener(
  "click",
  async () => {

    const users =
      Number(usersInput.value);

    const imageFile =
      testImage.files[0];

    if (
      !Number.isInteger(users) ||
      users < 1 ||
      users > 1000
    ) {

      alert(
        "Enter a number between 1 and 1000"
      );

      return;
    }

    if (!imageFile) {

      alert(
        "Choose a test image first"
      );

      return;
    }

    if (users > 100) {

      const confirmed =
        confirm(
          `You are about to start ${users} simultaneous exports.\n\nThis can overload or crash the Railway service.\n\nContinue?`
        );

      if (!confirmed) {
        return;
      }

    }

    startBtn.disabled = true;

    completedEl.textContent = "0";
    successEl.textContent = "0";
    failedEl.textContent = "0";
    averageEl.textContent = "0s";
    fastestEl.textContent = "0s";
    slowestEl.textContent = "0s";

    progressBar.style.width =
      "0%";

    statusEl.textContent =
      `Starting ${users} simultaneous exports...`;

    const hookBlob =
      await createHookBlob();

    let completed = 0;
    let success = 0;
    let failed = 0;

    const times = [];

    const testStarted =
      performance.now();

    const jobs =
      Array.from(
        { length: users },
        (_, index) => {

          return runSingleExport(
            imageFile,
            hookBlob,
            index + 1
          ).then((result) => {

            completed++;

            if (result.success) {
              success++;
            } else {
              failed++;
            }

            times.push(
              result.time
            );

            completedEl.textContent =
              completed;

            successEl.textContent =
              success;

            failedEl.textContent =
              failed;

            const average =
              times.reduce(
                (a, b) => a + b,
                0
              ) / times.length;

            averageEl.textContent =
              `${average.toFixed(2)}s`;

            fastestEl.textContent =
              `${Math.min(...times).toFixed(2)}s`;

            slowestEl.textContent =
              `${Math.max(...times).toFixed(2)}s`;

            progressBar.style.width =
              `${(completed / users) * 100}%`;

            statusEl.textContent =
              `Running...\n${completed} / ${users} completed`;

            return result;

          });

        }
      );

    const results =
      await Promise.all(jobs);

    const totalTime =
      (
        (
          performance.now() -
          testStarted
        ) / 1000
      ).toFixed(2);

    const errors =
      results
        .filter(
          (result) =>
            !result.success
        )
        .map(
          (result) =>
            result.error
        );

    statusEl.textContent =
      `Test finished ✅

Users: ${users}
Success: ${success}
Failed: ${failed}
Total test time: ${totalTime}s${
        errors.length
          ? `

Errors:
${errors.slice(0, 10).join("\n")}`
          : ""
      }`;

    startBtn.disabled = false;

  }
);

</script>

</body>
</html>
