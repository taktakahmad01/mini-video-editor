<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template 1</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="compact-editor">

    <header class="compact-topbar">

      <button
        class="compact-back"
        onclick="window.location.href='./index.html'"
      >
        ←
      </button>

      <div class="compact-title">
        <strong>Template 1</strong>
        <span>Hook Reveal</span>
      </div>

      <button
        id="exportBtn"
        class="top-export-btn"
      >
        Export
      </button>

    </header>


    <section class="compact-workspace">

      <div class="video-shell">

        <div id="reelPreview" class="compact-reel">

          <div id="hookOutput" class="compact-hook">
            POV:<br>
            Your hook goes here
          </div>

          <div class="compact-image-box">

            <span id="imagePlaceholder">
              Your image
            </span>

            <img
              id="previewImage"
              alt=""
            >

          </div>

        </div>


        <div class="video-player-controls">

          <button id="videoPlayBtn" class="video-play-btn">
            ▶
          </button>

          <div class="video-time">
            <span id="currentTime">0:00</span>
            <span>/</span>
            <span id="totalTime">0:05</span>
          </div>

          <div class="mini-progress">
            <div
              id="progressFill"
              class="mini-progress-fill"
            ></div>
          </div>

        </div>

      </div>


      <div class="compact-fields">

        <div class="compact-field">

          <label for="hookInput">
            Hook
          </label>

          <textarea
            id="hookInput"
            maxlength="120"
            placeholder="Write your hook..."
          ></textarea>

        </div>


        <div class="compact-field image-field">

          <label>
            Image
          </label>

          <input
            id="imageInput"
            type="file"
            accept="image/*"
          >

        </div>

      </div>


      <button
        id="previewBtn"
        class="bottom-preview-btn"
      >
        ▶ Preview
      </button>

      <p id="editorStatus"></p>

    </section>


    <audio
      id="templateAudio"
      preload="auto"
      src="./template1.mp3"
    ></audio>

  </main>


  <script>

    const hookInput = document.getElementById("hookInput");
    const hookOutput = document.getElementById("hookOutput");

    const imageInput = document.getElementById("imageInput");
    const previewImage = document.getElementById("previewImage");
    const imagePlaceholder = document.getElementById("imagePlaceholder");

    const previewBtn = document.getElementById("previewBtn");
    const videoPlayBtn = document.getElementById("videoPlayBtn");

    const exportBtn = document.getElementById("exportBtn");

    const templateAudio = document.getElementById("templateAudio");

    const currentTime = document.getElementById("currentTime");
    const totalTime = document.getElementById("totalTime");
    const progressFill = document.getElementById("progressFill");

    const editorStatus = document.getElementById("editorStatus");


    let selectedImage = null;
    let playing = false;
    let animationFrame = null;


    /*
      TEMPLATE 1 TIMING
    */

    const REVEAL_START = 0.95;

    const REEL_END = 5.04;

    const REVEAL_DURATION =
      REEL_END - REVEAL_START;


    totalTime.textContent =
      formatTime(REEL_END);


    hookInput.addEventListener("input", () => {

      const value = hookInput.value.trim();

      if (!value) {
        hookOutput.innerHTML =
          "POV:<br>Your hook goes here";
        return;
      }

      hookOutput.textContent = value;

    });


    imageInput.addEventListener("change", () => {

      selectedImage = imageInput.files[0];

      if (!selectedImage) return;

      const imageUrl =
        URL.createObjectURL(selectedImage);

      previewImage.src = imageUrl;

      previewImage.style.display = "block";
      previewImage.style.opacity = "0";
      previewImage.style.filter = "brightness(0)";

      imagePlaceholder.style.display = "none";

    });


    previewBtn.addEventListener(
      "click",
      togglePreview
    );

    videoPlayBtn.addEventListener(
      "click",
      togglePreview
    );


    async function togglePreview() {

      if (!selectedImage) {
        alert("Choose an image first");
        return;
      }

      if (playing) {
        stopPreview();
      } else {
        await startPreview();
      }

    }


    async function startPreview() {

      playing = true;

      videoPlayBtn.textContent = "❚❚";
      previewBtn.textContent = "❚❚ Stop";

      templateAudio.currentTime = 0;

      resetVisuals();

      try {
        await templateAudio.play();
      } catch (error) {
        console.error(error);
        playing = false;
        return;
      }

      previewLoop();

    }


    function stopPreview() {

      playing = false;

      templateAudio.pause();

      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
      }

      videoPlayBtn.textContent = "▶";
      previewBtn.textContent = "▶ Preview";

    }


    function previewLoop() {

      if (!playing) return;

      const time = templateAudio.currentTime;

      updatePreview(time);


      /*
        END = image 100%
        then loop automatically
      */

      if (time >= REEL_END - 0.03) {

        templateAudio.currentTime = 0;

        resetVisuals();

        templateAudio.play().catch(() => {});

      }

      animationFrame =
        requestAnimationFrame(previewLoop);

    }


    function updatePreview(time) {

      currentTime.textContent =
        formatTime(time);

      const videoProgress =
        Math.min(time / REEL_END, 1);

      progressFill.style.width =
        `${videoProgress * 100}%`;


      /*
        BEFORE BEAT
      */

      if (time < REVEAL_START) {

        previewImage.style.opacity = "0";
        previewImage.style.filter =
          "brightness(0)";

        return;

      }


      /*
        AFTER BEAT:
        image reveals gradually
        until 100% at reel end
      */

      const revealProgress =
        Math.min(
          (time - REVEAL_START) /
          REVEAL_DURATION,
          1
        );

      previewImage.style.opacity =
        revealProgress;

      previewImage.style.filter =
        `brightness(${revealProgress})`;

    }


    function resetVisuals() {

      currentTime.textContent = "0:00";

      progressFill.style.width = "0%";

      if (previewImage.src) {
        previewImage.style.opacity = "0";
        previewImage.style.filter =
          "brightness(0)";
      }

    }


    function formatTime(seconds) {

      const safeSeconds =
        Math.max(0, seconds || 0);

      const minutes =
        Math.floor(safeSeconds / 60);

      const secs =
        Math.floor(safeSeconds % 60);

      return (
        minutes +
        ":" +
        secs.toString().padStart(2, "0")
      );

    }


    exportBtn.addEventListener(
      "click",
      () => {

        editorStatus.textContent =
          "Export connection comes next.";

      }
    );

  </script>

</body>
</html>
