<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Template 1</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <main class="compact-editor">

    <header class="compact-topbar">

      <button
        class="compact-back"
        onclick="window.location.href='./index.html'"
        aria-label="Back"
      >
        ←
      </button>

      <div class="compact-title">
        <strong>Template 1</strong>
        <span>Hook Reveal</span>
      </div>

      <button
        id="exportBtn"
        class="top-export-btn"
      >
        Export
      </button>

    </header>


    <section class="compact-workspace">

      <div class="video-shell">

        <div
          id="reelPreview"
          class="compact-reel"
        >

          <div
            class="reel-space reel-space-top"
          ></div>


          <div
            id="hookOutput"
            class="compact-hook"
          >
            Your hook goes here
          </div>


          <div class="compact-image-box">

            <span
              id="imagePlaceholder"
              class="image-placeholder"
            >
              Your image
            </span>

            <img
              id="previewImage"
              alt="Selected image preview"
            >

          </div>


          <div
            class="reel-space reel-space-bottom"
          ></div>

        </div>


        <div class="video-player-controls">

          <button
            id="videoPlayBtn"
            class="video-play-btn"
            aria-label="Play preview"
          >
            ▶
          </button>


          <div class="video-time">

            <span id="currentTime">
              0:00
            </span>

            <span>/</span>

            <span id="totalTime">
              0:05
            </span>

          </div>


          <div class="mini-progress">

            <div
              id="progressFill"
              class="mini-progress-fill"
            ></div>

          </div>

        </div>

      </div>


      <div class="compact-fields">

        <div class="compact-field hook-field">

          <label for="hookInput">
            Hook
          </label>

          <textarea
            id="hookInput"
            maxlength="120"
            placeholder="Write your hook..."
            rows="2"
          ></textarea>

        </div>


        <div class="compact-field image-field">

          <label for="imageInput">
            Image
          </label>

          <input
            id="imageInput"
            type="file"
            accept="image/*"
          >

        </div>

      </div>


      <button
        id="previewBtn"
        class="bottom-preview-btn"
      >
        ▶ Preview
      </button>


      <p id="editorStatus"></p>

    </section>


    <audio
      id="templateAudio"
      preload="auto"
      src="./template1.mp3"
    ></audio>

  </main>


  <script>

    const hookInput =
      document.getElementById("hookInput");

    const hookOutput =
      document.getElementById("hookOutput");

    const imageInput =
      document.getElementById("imageInput");

    const previewImage =
      document.getElementById("previewImage");

    const imagePlaceholder =
      document.getElementById("imagePlaceholder");

    const previewBtn =
      document.getElementById("previewBtn");

    const videoPlayBtn =
      document.getElementById("videoPlayBtn");

    const exportBtn =
      document.getElementById("exportBtn");

    const templateAudio =
      document.getElementById("templateAudio");

    const currentTime =
      document.getElementById("currentTime");

    const totalTime =
      document.getElementById("totalTime");

    const progressFill =
      document.getElementById("progressFill");

    const editorStatus =
      document.getElementById("editorStatus");


    let selectedImage = null;

    let selectedImageUrl = null;

    let playing = false;

    let animationFrame = null;


    /*
      TEMPLATE 1 TIMING
    */

    const REVEAL_START = 0.95;

    const REEL_END = 5.04;

    const REVEAL_DURATION =
      REEL_END - REVEAL_START;


    totalTime.textContent =
      formatTime(REEL_END);


    /*
      Detect Arabic
      باش نضبط direction والخط
    */

    function containsArabic(text) {

      return /[\u0600-\u06FF]/.test(text);

    }


    function updateHook() {

      const value =
        hookInput.value.trim();


      if (!value) {

        hookOutput.textContent =
          "Your hook goes here";

        hookOutput.classList.remove(
          "arabic-hook"
        );

        hookOutput.dir = "ltr";

        return;

      }


      hookOutput.textContent = value;


      if (containsArabic(value)) {

        hookOutput.classList.add(
          "arabic-hook"
        );

        hookOutput.dir = "rtl";

      } else {

        hookOutput.classList.remove(
          "arabic-hook"
        );

        hookOutput.dir = "ltr";

      }

    }


    hookInput.addEventListener(
      "input",
      updateHook
    );


    imageInput.addEventListener(
      "change",
      () => {

        selectedImage =
          imageInput.files[0];


        if (!selectedImage) {
          return;
        }


        if (selectedImageUrl) {

          URL.revokeObjectURL(
            selectedImageUrl
          );

        }


        selectedImageUrl =
          URL.createObjectURL(
            selectedImage
          );


        previewImage.src =
          selectedImageUrl;


        previewImage.style.display =
          "block";


        previewImage.style.opacity =
          "0";


        previewImage.style.filter =
          "brightness(0)";


        imagePlaceholder.style.display =
          "none";

      }
    );


    previewBtn.addEventListener(
      "click",
      togglePreview
    );


    videoPlayBtn.addEventListener(
      "click",
      togglePreview
    );


    async function togglePreview() {

      if (!selectedImage) {

        alert(
          "Choose an image first"
        );

        return;

      }


      if (playing) {

        stopPreview();

      } else {

        await startPreview();

      }

    }


    async function startPreview() {

      playing = true;


      videoPlayBtn.textContent =
        "❚❚";


      previewBtn.textContent =
        "❚❚ Stop";


      templateAudio.pause();


      templateAudio.currentTime =
        0;


      resetVisuals();


      try {

        await templateAudio.play();

      } catch (error) {

        console.error(error);


        playing = false;


        videoPlayBtn.textContent =
          "▶";


        previewBtn.textContent =
          "▶ Preview";


        editorStatus.textContent =
          "Audio could not start.";

        return;

      }


      previewLoop();

    }


    function stopPreview() {

      playing = false;


      templateAudio.pause();


      if (animationFrame) {

        cancelAnimationFrame(
          animationFrame
        );

      }


      videoPlayBtn.textContent =
        "▶";


      previewBtn.textContent =
        "▶ Preview";

    }


    function previewLoop() {

      if (!playing) {
        return;
      }


      const time =
        templateAudio.currentTime;


      updatePreview(time);


      /*
        ملي توصل الصورة 100%
        = نهاية الـReel
        ومن بعد loop
      */

      if (
        time >=
        REEL_END - 0.03
      ) {

        templateAudio.currentTime =
          0;


        resetVisuals();


        templateAudio
          .play()
          .catch(() => {});

      }


      animationFrame =
        requestAnimationFrame(
          previewLoop
        );

    }


    function updatePreview(time) {

      currentTime.textContent =
        formatTime(time);


      const videoProgress =
        Math.min(
          time / REEL_END,
          1
        );


      progressFill.style.width =
        `${videoProgress * 100}%`;


      /*
        قبل reveal
      */

      if (
        time < REVEAL_START
      ) {

        previewImage.style.opacity =
          "0";


        previewImage.style.filter =
          "brightness(0)";


        return;

      }


      /*
        reveal تدريجي
      */

      const revealProgress =
        Math.min(
          (
            time -
            REVEAL_START
          ) /
          REVEAL_DURATION,
          1
        );


      previewImage.style.opacity =
        revealProgress;


      previewImage.style.filter =
        `brightness(${revealProgress})`;

    }


    function resetVisuals() {

      currentTime.textContent =
        "0:00";


      progressFill.style.width =
        "0%";


      if (previewImage.src) {

        previewImage.style.opacity =
          "0";


        previewImage.style.filter =
          "brightness(0)";

      }

    }


    function formatTime(seconds) {

      const safeSeconds =
        Math.max(
          0,
          seconds || 0
        );


      const minutes =
        Math.floor(
          safeSeconds / 60
        );


      const secs =
        Math.floor(
          safeSeconds % 60
        );


      return (
        minutes +
        ":" +
        secs
          .toString()
          .padStart(
            2,
            "0"
          )
      );

    }


    exportBtn.addEventListener(
      "click",
      () => {

        editorStatus.textContent =
          "Export connection comes next.";

      }
    );

  </script>

</body>
</html>
