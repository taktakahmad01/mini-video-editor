<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Test</title>
</head>
<body>

  <input id="videoInput" type="file" accept="video/*">

  <video
    id="video"
    controls
    style="width:100%;max-width:400px;margin-top:20px;">
  </video>

  <button
    id="exportBtn"
    style="display:block;margin-top:20px;padding:15px;">
    Export Test
  </button>

  <p id="status"></p>

  <script>
    const videoInput = document.getElementById("videoInput");
    const video = document.getElementById("video");
    const exportBtn = document.getElementById("exportBtn");
    const status = document.getElementById("status");

    let file = null;

    videoInput.addEventListener("change", () => {
      file = videoInput.files[0];

      if (!file) return;

      video.src = URL.createObjectURL(file);
      status.textContent = "Video ready";
    });

    exportBtn.addEventListener("click", async () => {

      if (!file) {
        alert("Choose a video first");
        return;
      }

      status.textContent = "Exporting...";

      const formData = new FormData();
      formData.append("video", file);

      try {
        const response = await fetch(
          "https://mini-video-editor-production.up.railway.app/export",
          {
            method: "POST",
            body: formData
          }
        );

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || "Export failed");
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "export-test.mp4";

        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => {
          URL.revokeObjectURL(url);
        }, 1000);

        status.textContent = "Done ✓";

      } catch (error) {
        console.error(error);
        status.textContent = "Export failed: " + error.message;
      }

    });
  </script>

</body>
</html>
