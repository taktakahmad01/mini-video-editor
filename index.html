<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reel Templates</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="home">

    <header class="home-header">
      <h1>Reel Templates</h1>
      <p>Choose a template and create your reel</p>
    </header>

    <section class="templates">

      <button
        class="template-card"
        onclick="window.location.href='./editor.html'"
      >

        <div class="template-preview">

          <div class="reel-preview">

            <div class="hook-preview">
              POV:<br>
              Your hook goes here
            </div>

            <div class="image-preview">
              IMAGE
            </div>

          </div>

          <div class="play-icon">▶</div>

        </div>

        <div class="template-info">
          <div>
            <h2>Template 1</h2>
            <span>Hook Reveal</span>
          </div>

          <span class="use-template">
            Use template →
          </span>
        </div>

      </button>

    </section>

  </main>

</body>
</html>
