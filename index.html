<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Video Cutter</title>

  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

  <main class="app">

    <h1>Video Cutter</h1>

    <label class="upload-btn">
      Choose Video
      <input
        type="file"
        id="videoInput"
        accept="video/*"
        hidden
      />
    </label>

    <section
      id="editor"
      class="editor hidden"
    >

      <div class="video-box">

        <video
          id="video"
          playsinline
          preload="metadata"
        ></video>

        <button
          id="playBtn"
          class="play-overlay"
        >
          ▶
        </button>

      </div>


      <div class="time-info">
        <span id="currentTime">00:00</span>
        <span id="totalTime">00:00</span>
      </div>


      <div class="timeline-wrapper">

        <div
          id="timeline"
          class="timeline"
        >

          <div
            id="segments"
            class="segments"
          ></div>

          <div
            id="playhead"
            class="playhead"
          ></div>

        </div>

      </div>


      <div class="tools">

        <button
          id="splitBtn"
          class="tool-btn split"
        >
          ✂️ Split
        </button>

        <button
          id="deleteBtn"
          class="tool-btn delete"
          disabled
        >
          🗑 Delete
        </button>

      </div>


      <div class="help">
        Tap timeline → Split → select part → Delete
      </div>

    </section>

  </main>

  <script src="script.js?v=2"></script>

</body>
</html>
