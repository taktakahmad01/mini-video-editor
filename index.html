<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Video Editor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f1014;
      color: white;
      min-height: 100vh;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #292b31;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
    }

    .export-btn {
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .preview {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9 / 16;
      max-height: 58vh;
      margin: auto;
      background: #050505;
      border: 1px solid #292b31;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .upload-label {
      padding: 14px 20px;
      background: white;
      color: black;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    #videoInput {
      display: none;
    }

    .timeline {
      margin-top: 20px;
      height: 70px;
      background: #1b1d23;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8f929a;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .tool {
      background: #1b1d23;
      color: white;
      border: 0;
      border-radius: 9px;
      padding: 13px 5px;
      cursor: pointer;
    }

    @media (min-width: 800px) {
      main {
        padding: 30px;
      }

      .preview {
        max-height: 62vh;
      }

      .tools {
        max-width: 600px;
        margin: 16px auto 0;
      }

      .timeline {
        max-width: 800px;
        margin: 24px auto 0;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Video Editor</div>
  <button class="export-btn">Export</button>
</header>

<main>

  <div class="preview">

    <label class="upload-label" id="uploadButton">
      + Add video
      <input
        type="file"
        id="videoInput"
        accept="video/*"
      >
    </label>

    <video
      id="video"
      controls
      playsinline>
    </video>

  </div>

  <div class="timeline">
    Timeline
  </div>

  <div class="tools">
    <button class="tool">✂️ Trim</button>
    <button class="tool">T Text</button>
    <button class="tool">♫ Audio</button>
    <button class="tool">⚡ Speed</button>
  </div>

</main>

<script>
  const input = document.getElementById("videoInput");
  const video = document.getElementById("video");
  const uploadButton = document.getElementById("uploadButton");

  input.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const videoURL = URL.createObjectURL(file);

    video.src = videoURL;
    video.style.display = "block";
    uploadButton.style.display = "none";

  });
</script>

</body>
</html>
