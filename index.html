<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mini Video Editor</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">

    <div class="logo">
      Video Editor
    </div>

    <button
      class="export-btn"
      id="exportBtn"
      type="button"
    >
      Export
    </button>

  </header>


  <main class="editor">


    <!-- VIDEO PREVIEW -->

    <section class="preview-section">

      <div class="video-wrapper">

        <label
          class="upload-btn"
          id="uploadBtn"
        >
          + Add Video

          <input
            type="file"
            id="videoInput"
            accept="video/*"
          >

        </label>


        <video
          id="video"
          playsinline
          controls
        ></video>

      </div>

    </section>



    <!-- TRIM -->

    <section
      class="trim-panel"
      id="trimPanel"
    >

      <div class="trim-header">

        <div>
          Start
          <strong id="startText">
            0:00
          </strong>
        </div>

        <div>
          End
          <strong id="endText">
            0:00
          </strong>
        </div>

      </div>



      <div class="range-row">

        <span>
          Start
        </span>

        <input
          type="range"
          id="startRange"
          min="0"
          max="100"
          value="0"
          step="0.1"
        >

      </div>



      <div class="range-row">

        <span>
          End
        </span>

        <input
          type="range"
          id="endRange"
          min="0"
          max="100"
          value="100"
          step="0.1"
        >

      </div>


      <button
        class="preview-trim-btn"
        id="previewTrimBtn"
        type="button"
      >
        ▶ Preview Trim
      </button>

    </section>



    <!-- TOOLS -->

    <section class="tools">

      <button
        class="tool-btn active"
        type="button"
      >
        ✂️
        <span>Trim</span>
      </button>


      <button
        class="tool-btn"
        type="button"
      >
        T
        <span>Text</span>
      </button>


      <button
        class="tool-btn"
        type="button"
      >
        ♫
        <span>Audio</span>
      </button>


      <button
        class="tool-btn"
        type="button"
      >
        ⚡
        <span>Speed</span>
      </button>

    </section>


  </main>


  <script src="script.js"></script>

</body>
</html>
